name: CI

# Backend test suite + frontend lint/build, on every push and PR -- what the README's
# CI badge actually points at. No secrets required: tests/conftest.py points the whole
# backend suite at a throwaway temp-file SQLite DB before any app module imports, and
# tests/test_main_live_endpoint.py's `_mocked_network` fixture is autouse=True, so the
# one live endpoint's tests never make a real network call either. Nothing here needs
# a Razorpay/Gemini/Groq key.

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run test suite
        working-directory: backend
        run: pytest -q

  frontend:
    name: frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint (oxlint + artifact-import-boundary check)
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
